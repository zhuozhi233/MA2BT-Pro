name: Build Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, for example 1.2.9"
        required: true
        default: "1.2.9"
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  packageName: "com.zhuozhi.ma2bt-pro"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set version in package.json
        run: |
          jq --arg ver "${{ steps.version.outputs.version }}" '.version = $ver' package.json > tmp.json
          mv tmp.json package.json

      - name: Create zip
        run: |
          mkdir -p release
          zip -r "release/${{ env.packageName }}-${{ steps.version.outputs.version }}.zip" . \
            -x ".git/*" ".github/*" "release/*"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "MA2BT Pro ${{ steps.version.outputs.version }}"
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/${{ env.packageName }}-${{ steps.version.outputs.version }}.zip
            package.json